# Gentoo-rice – hyprlock (Farben aus dem Wallpaper)
source = ~/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.cache/rice/current.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 110
    font_family = JetBrains Mono ExtraBold
    shadow_passes = 2
    position = 0, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date +"%A, %-d. %B"
    color = $accent
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♪  {{artist}} – {{title}}' 2>/dev/null
    color = $foreground
    font_size = 12
    font_family = JetBrains Mono
    position = 0, 60
    halign = center
    valign = bottom
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 10
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent $accent2 45deg
    inner_color = $bgAlpha
    font_color = $foreground
    font_family = JetBrains Mono
    check_color = $accent2
    fail_color = rgb(ff5577)
    fail_text = Falsches Passwort
    placeholder_text = Passwort …
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
