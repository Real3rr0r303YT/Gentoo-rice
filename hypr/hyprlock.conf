general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/.local/share/gentoo-rice/wallpapers/gradient.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(F5F5F7FF)
    font_size = 96
    font_family = Inter Bold
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date +"%A, %-d. %B"
    color = rgba(F5F5F7CC)
    font_size = 20
    font_family = Inter
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(F5F5F7E6)
    font_size = 15
    font_family = Inter Medium
    position = 0, -60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    rounding = 22
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(FFFFFF14)
    inner_color = rgba(2C2C2EB3)
    font_color = rgba(F5F5F7FF)
    font_family = Inter
    check_color = rgba(0A84FFFF)
    fail_color = rgba(FF453AFF)
    fail_text = Falsches Passwort
    placeholder_text = Passwort eingeben
    fade_on_empty = false
    position = 0, -120
    halign = center
    valign = center
}
