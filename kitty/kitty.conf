font_family      JetBrains Mono
bold_font        auto
italic_font      auto
font_size        11.5
disable_ligatures never

window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.88
dynamic_background_opacity yes
cursor_shape beam
cursor_blink_interval 0.6
enable_audio_bell no
scrollback_lines 10000
url_style curly

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

foreground            #F5F5F7
background            #1C1C1E
selection_foreground  #F5F5F7
selection_background  #0A84FF
cursor                #F5F5F7
cursor_text_color     #1C1C1E
url_color             #0A84FF
active_tab_foreground   #F5F5F7
active_tab_background   #2C2C2E
inactive_tab_foreground #8E8E93
inactive_tab_background #1C1C1E

color0  #2C2C2E
color8  #636366
color1  #FF453A
color9  #FF6961
color2  #32D74B
color10 #4CE06A
color3  #FFD60A
color11 #FFE04D
color4  #0A84FF
color12 #409CFF
color5  #BF5AF2
color13 #DA8FFF
color6  #64D2FF
color14 #8EE0FF
color7  #E5E5EA
color15 #F5F5F7
