# Gentoo-rice – Theme "catppuccin-mocha"
NAME="catppuccin-mocha"
DESC="Pastell auf Dunkel"
# dynamic = Farben aus dem Wallpaper (pywal16), static = feste Palette unten
MODE=static
# dark | light (GTK/libadwaita-Farbschema)
SCHEME=dark
BG="#1e1e2e"
FG="#cdd6f4"
# color0 … color15 (color4/color5 = Akzentfarben)
PALETTE="#45475a #f38ba8 #a6e3a1 #f9e2af #89b4fa #cba6f7 #94e2d5 #bac2de #585b70 #f38ba8 #a6e3a1 #f9e2af #89b4fa #f5c2e7 #94e2d5 #a6adc8"
# Look
GAPS_IN=5
GAPS_OUT=10
ROUNDING=12
BORDER=2
ACTIVE_OPACITY=0.88
INACTIVE_OPACITY=0.78
BLUR_SIZE=10
BLUR_PASSES=3
# Mauszeiger: Bibata-Modern-Ice (weiß) | Bibata-Modern-Classic (schwarz) | Bibata-Modern-Amber
CURSOR=Bibata-Modern-Ice
CURSOR_SIZE=24
# gradient = Verlaufs-Wallpaper aus den Theme-Farben erzeugen, keep = aktuelles Wallpaper behalten
WALLPAPER=gradient
