# Gentoo-rice – Theme "gruvbox"
NAME="gruvbox"
DESC="Warm, retro"
# dynamic = Farben aus dem Wallpaper (pywal16), static = feste Palette unten
MODE=static
# dark | light (GTK/libadwaita-Farbschema)
SCHEME=dark
BG="#282828"
FG="#ebdbb2"
# color0 … color15 (color4/color5 = Akzentfarben)
PALETTE="#3c3836 #fb4934 #b8bb26 #fabd2f #83a598 #d3869b #8ec07c #d5c4a1 #665c54 #fb4934 #b8bb26 #fabd2f #83a598 #d3869b #8ec07c #fbf1c7"
# Look
GAPS_IN=5
GAPS_OUT=10
ROUNDING=6
BORDER=2
ACTIVE_OPACITY=0.92
INACTIVE_OPACITY=0.85
BLUR_SIZE=8
BLUR_PASSES=2
# gradient = Verlaufs-Wallpaper aus den Theme-Farben erzeugen, keep = aktuelles Wallpaper behalten
WALLPAPER=gradient
