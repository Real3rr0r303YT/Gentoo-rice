# Gentoo-rice – Theme "tokyo-night"
NAME="tokyo-night"
DESC="Neon-Nacht, blau/lila"
# dynamic = Farben aus dem Wallpaper (pywal16), static = feste Palette unten
MODE=static
# dark | light (GTK/libadwaita-Farbschema)
SCHEME=dark
BG="#1a1b26"
FG="#c0caf5"
# color0 … color15 (color4/color5 = Akzentfarben)
PALETTE="#15161e #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #a9b1d6 #414868 #f7768e #9ece6a #e0af68 #7aa2f7 #bb9af7 #7dcfff #c0caf5"
# Look
GAPS_IN=5
GAPS_OUT=10
ROUNDING=10
BORDER=2
ACTIVE_OPACITY=0.85
INACTIVE_OPACITY=0.75
BLUR_SIZE=12
BLUR_PASSES=4
# gradient = Verlaufs-Wallpaper aus den Theme-Farben erzeugen, keep = aktuelles Wallpaper behalten
WALLPAPER=gradient
