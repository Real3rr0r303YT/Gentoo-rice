# Gentoo-rice – hyprlock im Stil des Login-Screens (SDDM-Theme gentoo-rice)
# Farben aus dem Wallpaper/Theme, Avatar aus ~/.face (scripts/sddm-sync.sh)
source = ~/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
}

# Unscharfes Wallpaper
background {
    monitor =
    path = ~/.cache/rice/current.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.65
    vibrancy = 0.2
}

# Große Uhr + Datum (wie im Login-Screen)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $foreground
    font_size = 120
    font_family = JetBrains Mono ExtraBold
    shadow_passes = 2
    position = 0, 330
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] LC_TIME=de_DE.UTF-8 date +"%A, %-d. %B"
    color = $accent
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 235
    halign = center
    valign = center
}

# Glas-Karte
shape {
    monitor =
    size = 420, 300
    color = $bgAlpha
    rounding = 22
    border_size = 2
    border_color = $accent
    position = 0, -60
    halign = center
    valign = center
}

# Runder Avatar
image {
    monitor =
    path = ~/.cache/rice/avatar.png
    size = 104
    rounding = -1
    border_size = 3
    border_color = $accent
    position = 0, 25
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $foreground
    font_size = 16
    font_family = JetBrains Mono Bold
    position = 0, -55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 50
    outline_thickness = 2
    rounding = -1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent $accent2 45deg
    inner_color = rgba(ffffff14)
    font_color = $foreground
    font_family = JetBrains Mono
    check_color = $accent2
    fail_color = rgb(ff5577)
    fail_text = Falsches Passwort
    placeholder_text = Passwort …
    fade_on_empty = false
    position = 0, -120
    halign = center
    valign = center
}

# Aktueller Song unten
label {
    monitor =
    text = cmd[update:2000] playerctl metadata --format '♪  {{artist}} – {{title}}' 2>/dev/null
    color = $foreground
    font_size = 12
    font_family = JetBrains Mono
    position = 0, 50
    halign = center
    valign = bottom
}
