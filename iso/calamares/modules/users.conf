---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - wheel
  - audio
  - video
  - usb
  - input
  - plugdev
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: true
doReusePassword: true
passwordRequirements:
  minLength: 1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, gentoo ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "darkroot"
