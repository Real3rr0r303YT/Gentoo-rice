# Gentoo-rice – Theme "catppuccin-latte"
NAME="catppuccin-latte"
DESC="Pastell, hell"
# dynamic = Farben aus dem Wallpaper (pywal16), static = feste Palette unten
MODE=static
# dark | light (GTK/libadwaita-Farbschema)
SCHEME=light
BG="#eff1f5"
FG="#4c4f69"
# color0 … color15 (color4/color5 = Akzentfarben)
PALETTE="#5c5f77 #d20f39 #40a02b #df8e1d #1e66f5 #8839ef #179299 #acb0be #6c6f85 #d20f39 #40a02b #df8e1d #1e66f5 #ea76cb #179299 #bcc0cc"
# Look
GAPS_IN=5
GAPS_OUT=10
ROUNDING=12
BORDER=2
ACTIVE_OPACITY=0.92
INACTIVE_OPACITY=0.85
BLUR_SIZE=8
BLUR_PASSES=3
# gradient = Verlaufs-Wallpaper aus den Theme-Farben erzeugen, keep = aktuelles Wallpaper behalten
WALLPAPER=gradient
