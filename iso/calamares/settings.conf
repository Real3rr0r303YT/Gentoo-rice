# Darkroot OS – Calamares (Gentoo-Live-System → Festplatte, danach Gentoo-rice)
---
modules-search: [ local, /usr/lib64/calamares/modules, /usr/lib/calamares/modules ]

instances:
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf
- id: rice
  module: shellprocess
  config: shellprocess-rice.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@cleanup
  - shellprocess@rice
  - bootloader
  - umount
- show:
  - finished

branding: darkroot
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
