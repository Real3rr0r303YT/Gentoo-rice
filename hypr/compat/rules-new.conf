# Hyprland >= 0.53
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = float on, match:class ^(rice-float)$
windowrule = center on, match:class ^(rice-float)$
windowrule = float on, match:class ^(rice-lyrics)$
windowrule = pin on, match:class ^(rice-lyrics)$
windowrule = no_focus on, match:class ^(rice-lyrics)$
windowrule = suppress_event maximize, match:class .*

# Medien/Browser deckend
windowrule = opaque on, match:class ^(kitty|firefox|firefox-bin|mpv|vlc|imv)$

# Steam & Spiele: kein Blur, keine Transparenz, Vollbild + Tearing
windowrule = opaque on, match:class ^(steam|Steam|steam_app_.*|gamescope)$
windowrule = no_blur on, match:class ^(steam|Steam|steam_app_.*|gamescope)$
windowrule = fullscreen on, match:class ^(steam_app_.*|gamescope)$
windowrule = immediate on, match:class ^(steam_app_.*|gamescope)$

layerrule = blur on, match:namespace ^(waybar|rofi|notifications)$
layerrule = ignore_alpha 0.3, match:namespace ^(waybar|rofi|notifications)$

gesture = 3, horizontal, workspace

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
