# Gentoo-rice – Theme "sakura"
NAME="sakura"
DESC="Kirschblüte, rosa Anime-Look"
# dynamic = Farben aus dem Wallpaper (pywal16), static = feste Palette unten
MODE=static
# dark | light (GTK/libadwaita-Farbschema)
SCHEME=dark
BG="#1f1520"
FG="#f5e1ea"
# color0 … color15 (color4/color5 = Akzentfarben)
PALETTE="#2a1d2c #ff6b8b #9ad4a0 #f7c97e #ff9cc2 #c79bff #8fd6e1 #e8d3dd #5a4660 #ff8aa3 #b0e3b5 #fbd89c #ffb6d2 #d8b6ff #a8e4ec #fff3f8"
# Look
GAPS_IN=6
GAPS_OUT=12
ROUNDING=14
BORDER=2
ACTIVE_OPACITY=0.85
INACTIVE_OPACITY=0.75
BLUR_SIZE=14
BLUR_PASSES=4
# Mauszeiger: Bibata-Modern-Ice (weiß) | Bibata-Modern-Classic (schwarz) | Bibata-Modern-Amber
CURSOR=Bibata-Modern-Ice
CURSOR_SIZE=24
# gradient = Verlaufs-Wallpaper aus den Theme-Farben erzeugen, keep = aktuelles Wallpaper behalten
WALLPAPER=gradient
