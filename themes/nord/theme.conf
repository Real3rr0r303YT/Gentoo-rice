# Gentoo-rice – Theme "nord"
NAME="nord"
DESC="Kühles Blau-Grau"
# dynamic = Farben aus dem Wallpaper (pywal16), static = feste Palette unten
MODE=static
# dark | light (GTK/libadwaita-Farbschema)
SCHEME=dark
BG="#2e3440"
FG="#d8dee9"
# color0 … color15 (color4/color5 = Akzentfarben)
PALETTE="#3b4252 #bf616a #a3be8c #ebcb8b #88c0d0 #b48ead #8fbcbb #e5e9f0 #4c566a #bf616a #a3be8c #ebcb8b #81a1c1 #b48ead #8fbcbb #eceff4"
# Look
GAPS_IN=5
GAPS_OUT=10
ROUNDING=8
BORDER=2
ACTIVE_OPACITY=0.9
INACTIVE_OPACITY=0.8
BLUR_SIZE=8
BLUR_PASSES=3
# gradient = Verlaufs-Wallpaper aus den Theme-Farben erzeugen, keep = aktuelles Wallpaper behalten
WALLPAPER=gradient
