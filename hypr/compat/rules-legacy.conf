# Hyprland 0.48 – 0.52
windowrule = float, class:^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = float, class:^(rice-float)$
windowrule = center, class:^(rice-float)$
windowrule = float, class:^(rice-lyrics)$
windowrule = pin, class:^(rice-lyrics)$
windowrule = nofocus, class:^(rice-lyrics)$
windowrule = suppressevent maximize, class:.*

windowrule = opaque, class:^(kitty|firefox|firefox-bin|mpv|vlc|imv)$

windowrule = opaque, class:^(steam|Steam|steam_app_.*|gamescope)$
windowrule = noblur, class:^(steam|Steam|steam_app_.*|gamescope)$
windowrule = fullscreen, class:^(steam_app_.*|gamescope)$
windowrule = immediate, class:^(steam_app_.*|gamescope)$

layerrule = blur, ^(waybar|rofi|notifications)$
layerrule = ignorealpha 0.3, ^(waybar|rofi|notifications)$
