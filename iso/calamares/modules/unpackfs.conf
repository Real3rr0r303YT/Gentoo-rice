# Das laufende Live-System auf die Platte kopieren (rsync)
---
unpack:
  - source: "/"
    sourcefs: "file"
    destination: ""
    exclude:
      - "/proc/*"
      - "/sys/*"
      - "/dev/*"
      - "/run/*"
      - "/tmp/*"
      - "/mnt/*"
      - "/media/*"
      - "/lost+found"
      - "/home/*"
      - "/var/tmp/*"
      - "/var/cache/distfiles/*"
      - "/var/cache/binpkgs/*"
