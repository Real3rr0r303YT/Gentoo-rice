# Gentoo-rice – Hyprland (Anime/Lofi, Farben aus dem Wallpaper via pywal16)
# Hinweis: Hyprland mit Lua-Config (z. B. 0.57) liest stattdessen hypr/hyprland.lua.
# Copyright (C) 2026 3rr0r303YT – GPL-3.0-or-later

# Farben: wird von scripts/wallpaper.sh bei jedem Wallpaper-Wechsel neu erzeugt
source = ~/.cache/wal/colors-hyprland.conf

$rice    = ~/.local/share/gentoo-rice
$scripts = $rice/scripts
$term    = kitty
$float   = kitty --class rice-float -o remember_window_size=no
$menu    = pkill rofi || rofi -show drun
$files   = thunar
$browser = firefox-bin
$steam   = flatpak run com.valvesoftware.Steam

monitor = , preferred, auto, auto

# ── Umgebung ───────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── Autostart ──────────────────────────────────────────────
exec-once = $scripts/hypr-version.sh
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = gentoo-pipewire-launcher restart
exec-once = $scripts/cursor.sh Bibata-Modern-Ice 24
exec-once = $scripts/wallpaper.sh restore
exec-once = waybar
exec-once = mako -c ~/.cache/wal/mako-config
exec-once = hypridle
exec-once = ~/.local/share/gentoo-rice/scripts/antivirus.sh watch
exec-once = ~/.local/share/gentoo-rice/scripts/phone.sh daemon
exec-once = $scripts/polkit.sh

# ── Look ───────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = $accent $accent2 45deg
    col.inactive_border = $muted
    layout = dwindle
    resize_on_border = true
    allow_tearing = true
}

decoration {
    rounding = 10
    active_opacity = 0.85
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 12
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        noise = 0.02
        contrast = 1.0
        brightness = 0.85
        vibrancy = 0.25
        popups = true
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000088)
    }
}

animations {
    enabled = true
    bezier = soft, 0.22, 1, 0.36, 1
    bezier = overshot, 0.34, 1.4, 0.64, 1
    bezier = smooth, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 5, overshot, popin 80%
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = windowsMove, 1, 5, soft, slide
    animation = border, 1, 8, smooth
    animation = borderangle, 1, 60, smooth, loop
    animation = fade, 1, 5, smooth
    animation = layers, 1, 4, soft, slide
    animation = workspaces, 1, 5, soft, slidefade 20%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = $background
}

input {
    kb_layout = de
    follow_mouse = 1
    mouse_refocus = false
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.6
    }
}

cursor {
    enable_hyprcursor = true
    sync_gsettings_theme = true
    inactive_timeout = 5
    hide_on_key_press = true
    no_warps = true
}

# Versionsabhängige Regeln (Window-/Layer-Rules, Gesten, Gaming)
source = ~/.config/hypr/version.conf

# ── Keybinds ───────────────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, $term
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, B, exec, $browser
bind = $mod, G, exec, $steam
bind = $mod SHIFT, G, exec, $scripts/gaming-mode.sh toggle
bind = $mod, S, exec, flatpak run com.spotify.Client
bind = $mod, W, exec, $scripts/wallpaper-picker.sh
bind = $mod SHIFT, W, exec, $scripts/wallpaper.sh random
bind = $mod SHIFT, T, exec, $scripts/theme-picker.sh
bind = $mod, D, exec, $scripts/rice-menu.sh
bind = $mod SHIFT, A, exec, $scripts/app-store.sh
bind = $mod, Q, killactive
bind = $mod, F, exec, $browser
bind = $mod SHIFT, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exec, $scripts/powermenu.sh
bind = $mod SHIFT, R, exec, hyprctl reload

# Terminal-Spielzeug (schwebend)
bind = $mod, A, exec, $float -o initial_window_width=100c -o initial_window_height=18c sh -c 'cava -p ~/.cache/wal/cava-config'
bind = $mod, T, exec, $float -o initial_window_width=130c -o initial_window_height=38c btop
bind = $mod, M, exec, $float -o initial_window_width=110c -o initial_window_height=32c cmatrix -ab -C blue
bind = $mod, C, exec, $float -o initial_window_width=70c -o initial_window_height=12c tty-clock -cbs -C 4
bind = $mod, I, exec, $float -o initial_window_width=90c -o initial_window_height=24c --hold sh -c 'GENTOO_RICE_FASTFETCH=1 fastfetch'
bind = $mod, Y, exec, $scripts/lyrics.sh
bind = $mod, K, exec, kitty --class claude-code sh -c 'cd ~ && claude; exec bash'

bind = , Print, exec, $scripts/screenshot.sh area
bind = SHIFT, Print, exec, $scripts/screenshot.sh full

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, $scripts/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, $scripts/brightness.sh down
