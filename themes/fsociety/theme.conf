# Gentoo-rice – Theme "fsociety"
NAME="fsociety"
DESC="Schwarz/Rot, kantig, Terminal-Hacker"
# dynamic = Farben aus dem Wallpaper (pywal16), static = feste Palette unten
MODE=static
# dark | light (GTK/libadwaita-Farbschema)
SCHEME=dark
BG="#0a0a0a"
FG="#e6e6e6"
# color0 … color15 (color4/color5 = Akzentfarben)
PALETTE="#121212 #ff0033 #3ddc84 #ffb000 #ff0033 #b3001b #ff4d6d #cfcfcf #3a3a3a #ff3355 #5ef0a0 #ffc94d #ff335c #e0002a #ff7a8f #ffffff"
# Look
GAPS_IN=4
GAPS_OUT=8
ROUNDING=0
BORDER=2
ACTIVE_OPACITY=0.92
INACTIVE_OPACITY=0.85
BLUR_SIZE=6
BLUR_PASSES=2
# gradient = Verlaufs-Wallpaper aus den Theme-Farben erzeugen, keep = aktuelles Wallpaper behalten
WALLPAPER=gradient
