# Hyprland >= 0.53
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = suppress_event maximize, match:class .*

layerrule = blur on, match:namespace ^(waybar|wofi|notifications|nwg-dock)$
layerrule = ignore_alpha 0.2, match:namespace ^(waybar|wofi|notifications|nwg-dock)$

gesture = 3, horizontal, workspace

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
