# Gentoo-rice – Theme "clean"
NAME="clean"
DESC="Minimalistisch dunkel, blauer Akzent"
# dynamic = Farben aus dem Wallpaper (pywal16), static = feste Palette unten
MODE=static
# dark | light (GTK/libadwaita-Farbschema)
SCHEME=dark
BG="#1c1c1e"
FG="#f5f5f7"
# color0 … color15 (color4/color5 = Akzentfarben)
PALETTE="#2c2c2e #ff453a #32d74b #ffd60a #0a84ff #5e5ce6 #64d2ff #e5e5ea #636366 #ff6961 #4ce06a #ffe04d #409cff #7d7aff #8ee0ff #f5f5f7"
# Look
GAPS_IN=4
GAPS_OUT=8
ROUNDING=14
BORDER=1
ACTIVE_OPACITY=0.95
INACTIVE_OPACITY=0.88
BLUR_SIZE=10
BLUR_PASSES=3
# Mauszeiger: Bibata-Modern-Ice (weiß) | Bibata-Modern-Classic (schwarz) | Bibata-Modern-Amber
CURSOR=Bibata-Modern-Ice
CURSOR_SIZE=24
# gradient = Verlaufs-Wallpaper aus den Theme-Farben erzeugen, keep = aktuelles Wallpaper behalten
WALLPAPER=gradient
