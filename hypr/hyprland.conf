$rice    = ~/.local/share/gentoo-rice
$scripts = $rice/scripts
$term    = kitty
$menu    = pkill wofi || wofi --show drun
$files   = thunar

monitor = , preferred, auto, auto

# ── Umgebung ───────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── Autostart ──────────────────────────────────────────────
exec-once = $scripts/hypr-version.sh
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
exec-once = gentoo-pipewire-launcher restart
exec-once = hyprctl setcursor WhiteSur-cursors 24
exec-once = swaybg -m fill -i $rice/wallpapers/gradient.png
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = $scripts/dock.sh
exec-once = $scripts/polkit.sh

# ── Look ───────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(ffffff1f)
    col.inactive_border = rgba(ffffff0f)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        noise = 0.015
        contrast = 1.0
        brightness = 0.9
        vibrancy = 0.2
        popups = true
    }

    shadow {
        enabled = true
        range = 32
        render_power = 3
        offset = 0 8
        color = rgba(00000073)
        color_inactive = rgba(00000040)
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = soft, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 5, easeOut, popin 92%
    animation = windowsOut, 1, 4, soft, popin 92%
    animation = border, 1, 6, soft
    animation = fade, 1, 4, soft
    animation = layers, 1, 4, easeOut, fade
    animation = workspaces, 1, 5, easeOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(1C1C1E)
}

input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Versionsabhängige Regeln (Window-/Layer-Rules, Gesten)
source = ~/.config/hypr/version.conf

# ── Keybinds ───────────────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, $term
bind = $mod, Space, exec, $menu
bind = $mod, E, exec, $files
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, togglesplit
bind = $mod, L, exec, loginctl lock-session
bind = $mod SHIFT, E, exec, $scripts/powermenu.sh
bind = $mod SHIFT, R, exec, hyprctl reload

bind = , Print, exec, $scripts/screenshot.sh area
bind = SHIFT, Print, exec, $scripts/screenshot.sh full

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
