# Gentoo-rice – kitty (Farben aus dem Wallpaper via pywal16)
# Farben: von install.sh angelegter Link auf ~/.cache/wal/colors-kitty.conf
# (vor background_opacity, weil pywal dort 1.0 setzt)
include colors-wal.conf

font_family      JetBrains Mono
bold_font        auto
italic_font      auto
font_size        11
disable_ligatures never

window_padding_width 16
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.75
dynamic_background_opacity yes
cursor_shape beam
cursor_trail 3
enable_audio_bell no
scrollback_lines 10000
url_style curly
allow_remote_control socket-only
listen_on unix:/tmp/kitty-{kitty_pid}

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted


# Kopieren / Einfügen wie gewohnt
#   Strg+C: kopiert, wenn Text markiert ist – sonst wie immer Abbruch (SIGINT)
#   Strg+V: einfügen · Strg+Shift+C/V und Shift+Einfg gehen weiterhin
#   Rechtsklick: einfügen · Markieren kopiert automatisch
map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
map shift+insert paste_from_clipboard
mouse_map right press ungrabbed paste_from_clipboard
copy_on_select clipboard
clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
