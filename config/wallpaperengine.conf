# Gentoo-rice – Wallpaper-Engine-Einstellungen
# Kopie liegt unter ~/.config/gentoo-rice/wallpaperengine.conf (wird von install nicht überschrieben)

# Bilder pro Sekunde
WE_FPS=30
# 1 = ohne Ton (--silent), 0 = mit Ton
WE_SILENT=1
# 1 = automatisch stumm, wenn andere Apps Ton abspielen; 0 = --noautomute
WE_AUTOMUTE=1
# 1 = pausieren, solange auf dem aktiven Workspace ein Fenster im Vollbild ist (Spiele)
WE_PAUSE_ON_FULLSCREEN=1
# Skalierung: stretch | fit | fill | default
WE_SCALING=fill
# Weitere Argumente für linux-wallpaperengine, z. B. "--disable-mouse --disable-parallax"
WE_EXTRA_ARGS=""
# Zusätzliche Steam-Bibliotheken (durch Leerzeichen getrennt), falls nicht automatisch erkannt
WE_STEAM_LIBRARIES=""
